<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scoundrel">
    <title>Scoundrel Tracker Pro</title>
    <style>
        :root {
            --card-bg: #fdfdfd;
            --table-green: #35654d;
            --spade-black: #2b2b2b;
            --heart-red: #d32f2f;
            --diamond-blue: #0277bd;
        }
        body {
            background-color: var(--table-green);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }
        .playing-card {
            background-color: var(--card-bg);
            width: 92%;
            max-width: 400px;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #ddd;
            text-align: center;
            position: relative;
        }
        h1 { margin: 0; color: var(--spade-black); font-size: 1.2rem; letter-spacing: 2px; }
        
        .hp-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--heart-red);
            line-height: 1;
            margin: 5px 0;
        }
        
        .status-container { min-height: 50px; margin-bottom: 10px; }
        .status { font-weight: bold; font-size: 0.95rem; }
        .log { font-size: 0.8rem; color: #666; font-style: italic; margin-top: 4px; }

        .section-title { 
            font-size: 0.9rem; 
            margin: 12px 0 8px 0; 
            font-weight: bold; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between;
        }

        .btn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        
        button {
            background: white;
            border: 2px solid;
            border-radius: 6px;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: bold;
            min-height: 40px;
        }
        button:active { transform: scale(0.95); }
        
        .btn-weapon { color: var(--diamond-blue); border-color: var(--diamond-blue); }
        .btn-weapon.active { background: var(--diamond-blue); color: white; }
        
        .btn-dmg { color: var(--spade-black); border-color: var(--spade-black); }
        .btn-heal { color: var(--heart-red); border-color: var(--heart-red); }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 15px; }
        .undo-btn { background: #888; color: white; border: none; border-radius: 6px; }
        .reset-btn { background: var(--spade-black); color: white; border: none; border-radius: 6px; padding: 12px; }
    </style>
</head>
<body>

<div class="playing-card">
    <h1>SCOUNDREL TRACKER</h1>
    <div class="hp-display" id="hp">20</div>
    
    <div class="status-container">
        <div class="status" id="status">Viel Glück!</div>
        <div class="log" id="log">Wähle eine Waffe oder greife an.</div>
    </div>

    <div class="section-title">
        <span>♦️ WAFFE (Karo)</span>
        <span id="weapon-info">Keine</span>
    </div>
    <div class="btn-grid" id="weapon-grid">
        <button class="btn-weapon active" id="btn-wpn-0" onclick="equipWeapon(0)">0</button>
    </div>

    <div class="section-title">♠️/♣️ MONSTER (Schaden)</div>
    <div class="btn-grid" id="dmg-grid"></div>

    <div class="section-title">♥️ TRÄNKE (Heilung)</div>
    <div class="btn-grid" id="heal-grid"></div>

    <div class="controls">
        <button class="undo-btn" onclick="undo()">↩ Zurück</button>
        <button class="reset-btn" onclick="resetGame()">Neues Spiel</button>
    </div>
</div>

<script>
    let state = {
        hp: 20,
        weapon: 0,
        lastMonsterValue: 0,
        log: "Viel Glück!",
        status: "Bereit!",
        isDead: false
    };
    let history = [];

    function saveState() {
        history.push(JSON.stringify(state));
        if (history.length > 20) history.shift();
    }

    function undo() {
        if (history.length > 0) {
            state = JSON.parse(history.pop());
            updateUI();
        }
    }

    // UI Generierung
    const wGrid = document.getElementById('weapon-grid');
    for(let i=2; i<=10; i++) {
        let b = document.createElement('button');
        b.className = 'btn-weapon'; b.id = 'btn-wpn-'+i; b.innerText = i;
        b.onclick = () => equipWeapon(i); wGrid.appendChild(b);
    }

    const dGrid = document.getElementById('dmg-grid');
    const face = {11:'J', 12:'Q', 13:'K', 14:'A'};
    for(let i=1; i<=14; i++) {
        let b = document.createElement('button');
        b.className = 'btn-dmg'; b.innerText = face[i] || i;
        b.onclick = () => takeDamage(i, b.innerText); dGrid.appendChild(b);
    }

    const hGrid = document.getElementById('heal-grid');
    for(let i=2; i<=10; i++) {
        let b = document.createElement('button');
        b.className = 'btn-heal'; b.innerText = '+'+i;
        b.onclick = () => heal(i); hGrid.appendChild(b);
    }

    function equipWeapon(val) {
        if (state.isDead) return;
        saveState();
        state.weapon = val;
        state.lastMonsterValue = 0; // Reset Abnutzung bei neuer Waffe
        state.log = val > 0 ? `Waffe (${val}) bereit.` : "Faustkampf aktiv.";
        updateUI();
    }

    function takeDamage(val, name) {
        if (state.isDead) return;
        saveState();

        let usedWeapon = false;
        let finalDmg = val;

        if (state.weapon > 0) {
            if (val < state.lastMonsterValue || state.lastMonsterValue === 0) {
                finalDmg = Math.max(0, val - state.weapon);
                state.lastMonsterValue = val;
                usedWeapon = true;
            } else {
                state.log = `Waffe zu schwach für ${name}! Faustkampf!`;
            }
        }

        state.hp = Math.max(0, state.hp - finalDmg);
        if (usedWeapon) {
            state.log = `Waffe genutzt gegen ${name}. Schaden: ${finalDmg}`;
        } else if (state.hp > 0 && state.weapon > 0 && val >= state.lastMonsterValue && state.lastMonsterValue !== 0) {
            // Log wurde oben bereits gesetzt
        } else {
            state.log = `Faustkampf gegen ${name}. Schaden: ${val}`;
        }

        if (state.hp <= 0) { state.isDead = true; state.status = "GESTORBEN!"; }
        updateUI();
    }

    function heal(val) {
        if (state.isDead) return;
        saveState();
        let old = state.hp;
        state.hp = Math.min(20, state.hp + val);
        state.log = `Trank genutzt (+${state.hp - old} HP).`;
        updateUI();
    }

    function updateUI() {
        document.getElementById('hp').innerText = state.isDead ? "💀" : state.hp;
        document.getElementById('status').innerText = state.status;
        document.getElementById('log').innerText = state.log;
        document.getElementById('weapon-info').innerText = state.weapon > 0 ? 
            `${state.weapon} (Letztes Monster: ${state.lastMonsterValue || '-'})` : "Keine";
        
        document.querySelectorAll('.btn-weapon').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-wpn-' + state.weapon).classList.add('active');
        
        const btns = document.querySelectorAll('.btn-dmg, .btn-heal, .btn-weapon');
        btns.forEach(b => b.disabled = state.isDead);
    }

    function resetGame() {
        if(!confirm("Neues Spiel starten?")) return;
        history = [];
        state = { hp: 20, weapon: 0, lastMonsterValue: 0, log: "Neues Spiel begonnen.", status: "Viel Glück!", isDead: false };
        updateUI();
    }
    
    updateUI();
</script>
</body>
</html>
