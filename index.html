<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scoundrel">
    <title>Scoundrel Tracker</title>
    <style>
        :root {
            --card-bg: #fdfdfd;
            --table-green: #35654d;
            --spade-black: #2b2b2b;
            --heart-red: #d32f2f;
        }
        body {
            background-color: var(--table-green);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
            padding: 20px 0; /* Etwas Platz nach oben und unten für kleine Bildschirme */
        }
        .playing-card {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #ddd;
            text-align: center;
            position: relative;
        }
        /* Deko für die Kartenecken */
        .playing-card::before, .playing-card::after {
            content: "♠";
            position: absolute;
            font-size: 24px;
            color: #e0e0e0;
        }
        .playing-card::before { top: 10px; left: 15px; }
        .playing-card::after { bottom: 10px; right: 15px; transform: rotate(180deg); }

        h1 { 
            margin-top: 0; 
            color: var(--spade-black); 
            font-weight: 800; 
            letter-spacing: 2px;
            font-size: 1.5rem;
        }
        .hp-display {
            font-size: 5rem;
            font-weight: bold;
            color: var(--heart-red);
            margin: 5px 0;
            line-height: 1;
        }
        .status { 
            font-size: 1rem; 
            font-weight: bold; 
            min-height: 24px; 
            color: var(--spade-black); 
            margin-bottom: 10px;
        }
        .combat-log {
            font-size: 0.9rem;
            color: #666;
            min-height: 20px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .section-title { 
            font-size: 1rem; 
            margin-top: 15px; 
            margin-bottom: 10px; 
            font-weight: bold; 
            color: var(--spade-black); 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 5px;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        
        button {
            background: white;
            border: 2px solid;
            border-radius: 8px;
            padding: 8px 0;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            min-height: 40px;
        }
        button:active { transform: scale(0.92); }
        button:disabled { opacity: 0.4; pointer-events: none; }

        /* Waffe (Karo) */
        .btn-weapon { color: var(--heart-red); border-color: var(--heart-red); }
        .btn-weapon.active { background-color: var(--heart-red); color: white; transform: scale(1.05); box-shadow: 0 2px 8px rgba(211, 47, 47, 0.4); }
        
        /* Schaden (Pik/Kreuz) */
        .btn-dmg { color: var(--spade-black); border-color: var(--spade-black); }
        .btn-dmg:active { background-color: var(--spade-black); color: white; }
        .btn-dmg.face-card { font-size: 0.85rem; } /* Etwas kleinere Schrift für Bube, Dame, etc. */

        /* Heilung (Herz) */
        .btn-heal { color: var(--heart-red); border-color: var(--heart-red); }
        .btn-heal:active { background-color: var(--heart-red); color: white; }

        .reset-btn {
            background-color: var(--spade-black);
            color: white;
            width: 100%;
            border: none;
            margin-top: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            padding: 12px;
        }
        .reset-btn:active { background-color: #000; }
    </style>
</head>
<body>

<div class="playing-card">
    <h1>SCOUNDREL</h1>
    <div class="hp-display" id="hp">20</div>
    <div class="status" id="status">Bereit für den Dungeon!</div>
    <div class="combat-log" id="log"></div>

    <div class="section-title">
        <span>♦️ Waffe (ausgerüstet)</span>
        <span id="weapon-display">0</span>
    </div>
    <div class="btn-grid" id="weapon-grid">
        <button class="btn-weapon active" id="btn-wpn-0" onclick="equipWeapon(0)">Keine</button>
    </div>

    <div class="section-title">♠️/♣️ Schaden (Monster)</div>
    <div class="btn-grid" id="dmg-grid"></div>

    <div class="section-title">♥️ Heilung Tränke</div>
    <div class="btn-grid" id="heal-grid"></div>

    <button class="reset-btn" onclick="resetGame()">Neues Spiel</button>
</div>

<script>
    let currentHp = 20;
    const maxHp = 20;
    let currentWeapon = 0;
    let isDead = false;

    const hpEl = document.getElementById('hp');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const weaponDisplay = document.getElementById('weapon-display');

    // --- Waffen-Buttons (2-10) generieren ---
    const weaponGrid = document.getElementById('weapon-grid');
    for (let i = 2; i <= 10; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-weapon';
        btn.id = 'btn-wpn-' + i;
        btn.innerText = i;
        btn.onclick = () => equipWeapon(i);
        weaponGrid.appendChild(btn);
    }

    // --- Schaden-Buttons (1-14) generieren ---
    const dmgGrid = document.getElementById('dmg-grid');
    for (let i = 1; i <= 14; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-dmg';
        
        // Bildkarten benennen
        if (i === 11) { btn.innerText = 'Bube'; btn.classList.add('face-card'); }
        else if (i === 12) { btn.innerText = 'Dame'; btn.classList.add('face-card'); }
        else if (i === 13) { btn.innerText = 'König'; btn.classList.add('face-card'); }
        else if (i === 14) { btn.innerText = 'Ass'; btn.classList.add('face-card'); }
        else { btn.innerText = i; }

        btn.onclick = () => takeDamage(i, btn.innerText);
        dmgGrid.appendChild(btn);
    }

    // --- Heilungs-Buttons (2-10) generieren ---
    const healGrid = document.getElementById('heal-grid');
    for (let i = 2; i <= 10; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-heal';
        btn.innerText = '+' + i;
        btn.onclick = () => heal(i);
        healGrid.appendChild(btn);
    }

    function updateUI() {
        hpEl.innerText = currentHp;
        if (currentHp === 0) {
            isDead = true;
            hpEl.innerText = '💀';
            statusEl.innerText = 'Du bist tot. Spiel vorbei!';
            statusEl.style.color = 'var(--heart-red)';
            toggleButtons(true);
        } else {
            statusEl.style.color = 'var(--spade-black)';
            if (currentHp === maxHp) {
                statusEl.innerText = 'Volle Gesundheit!';
            } else if (currentHp <= 5) {
                statusEl.innerText = 'Achtung, fast tot!';
                statusEl.style.color = 'var(--heart-red)';
            } else {
                statusEl.innerText = 'Kämpfe weiter!';
            }
        }
    }

    function equipWeapon(value) {
        if (isDead) return;
        currentWeapon = value;
        weaponDisplay.innerText = value > 0 ? value : 'Keine';
        
        // Buttons visuell aktualisieren
        document.querySelectorAll('.btn-weapon').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-wpn-' + value).classList.add('active');
        
        if (value === 0) {
            logEl.innerText = "Waffe abgelegt.";
        } else {
            logEl.innerText = `Waffe mit Stärke ${value} ausgerüstet.`;
        }
    }

    function takeDamage(cardValue, cardName) {
        if (isDead) return;
        
        // Waffe vom Schaden abziehen (min. 0)
        let actualDamage = cardValue - currentWeapon;
        if (actualDamage < 0) actualDamage = 0;

        currentHp -= actualDamage;
        if (currentHp < 0) currentHp = 0;

        // Log aktualisieren
        if (currentWeapon > 0) {
            if (actualDamage === 0) {
                logEl.innerText = `Monster (${cardName}) komplett abgewehrt!`;
            } else {
                logEl.innerText = `Monster (${cardName}) macht ${actualDamage} Schaden (Waffe blockt ${currentWeapon}).`;
            }
        } else {
            logEl.innerText = `Monster (${cardName}) macht ${actualDamage} Schaden.`;
        }

        updateUI();
    }

    function heal(amount) {
        if (isDead) return;
        const oldHp = currentHp;
        currentHp += amount;
        if (currentHp > maxHp) currentHp = maxHp;
        
        const healedAmount = currentHp - oldHp;
        if (healedAmount > 0) {
            logEl.innerText = `Um ${healedAmount} geheilt.`;
        } else {
            logEl.innerText = `Schon bei voller Gesundheit!`;
        }
        updateUI();
    }

    function toggleButtons(disabled) {
        const btns = document.querySelectorAll('.btn-dmg, .btn-heal, .btn-weapon');
        btns.forEach(btn => btn.disabled = disabled);
    }

    function resetGame() {
        currentHp = 20;
        isDead = false;
        equipWeapon(0); // Setzt Waffe auf "Keine" zurück
        toggleButtons(false);
        updateUI();
        statusEl.innerText = 'Bereit für den Dungeon!';
        logEl.innerText = '';
    }
</script>
</body>
</html>
